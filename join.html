```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>انضم إلى SPARK | فريق تكنولوجيا المعلومات</title>

    <!-- اربط ملف التصميم الموجود في مشروعك -->
    <link rel="stylesheet" href="style.css">

    <style>
        .join-container {
            width: min(92%, 700px);
            margin: 40px auto;
        }

        .join-container h1,
        .join-container > p {
            text-align: center;
        }

        .form-card {
            display: grid;
            gap: 16px;
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 16px;
        }

        .form-card label {
            display: grid;
            gap: 7px;
            font-weight: 600;
        }

        .form-card input,
        .form-card select,
        .form-card textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font: inherit;
        }

        .form-card textarea {
            min-height: 110px;
            resize: vertical;
        }

        .form-card button {
            padding: 13px;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font: inherit;
            font-weight: bold;
        }

        .form-card button:disabled {
            cursor: wait;
            opacity: .65;
        }

        #formNotice {
            display: none;
            padding: 12px;
            border-radius: 8px;
            line-height: 1.7;
        }

        #formNotice.visible {
            display: block;
        }

        #formNotice.success {
            color: #166534;
            background: #dcfce7;
        }

        #formNotice.error {
            color: #991b1b;
            background: #fee2e2;
        }
    </style>
</head>

<body>

    <!-- إذا كان عندك شريط تنقل أصلي في join.html،
         يمكنك إبقاءه بدل هذا العنوان البسيط. -->

    <main class="join-container">
        <h1>انضم إلى SPARK ⚡</h1>

        <p>
            عندك شغف بالتكنولوجيا والألعاب وصناعة المحتوى؟
            عبّي النموذج التالي وقدّم طلب الانضمام لفريقنا.
        </p>

        <form class="form-card" id="joinForm" data-join-form>

            <label for="name">
                الاسم الكامل
                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                >
            </label>

            <label for="studentId">
                الرقم الجامعي
                <input
                    type="text"
                    id="studentId"
                    name="studentId"
                    required
                >
            </label>

            <label for="email">
                البريد الإلكتروني
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >
            </label>

            <label for="major">
                التخصص الجامعي
                <input
                    type="text"
                    id="major"
                    name="major"
                    required
                >
            </label>

            <label for="year">
                السنة الدراسية
                <select id="year" name="year" required>
                    <option value="">اختر السنة الدراسية</option>
                    <option value="First">السنة الأولى</option>
                    <option value="Second">السنة الثانية</option>
                    <option value="Third">السنة الثالثة</option>
                    <option value="Fourth">السنة الرابعة</option>
                    <option value="Other">أخرى</option>
                </select>
            </label>

            <label for="phone">
                رقم الهاتف
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    autocomplete="tel"
                    required
                >
            </label>

            <label for="team">
                الفريق الذي ترغب بالانضمام إليه
                <select id="team" name="team" required>
                    <option value="">اختر الفريق</option>
                    <option value="Games">SPARK Games</option>
                    <option value="Social Media">SPARK Media</option>
                </select>
            </label>

            <label for="skills">
                المهارات والخبرات
                <textarea
                    id="skills"
                    name="skills"
                    placeholder="مثلاً: Unity، برمجة، تصميم، مونتاج..."
                ></textarea>
            </label>

            <label for="reason">
                لماذا تريد الانضمام إلى SPARK؟
                <textarea
                    id="reason"
                    name="reason"
                    required
                ></textarea>
            </label>

            <div id="formNotice" role="status" aria-live="polite"></div>

            <button type="submit" id="submitApplication">
                إرسال طلب الانضمام
            </button>

        </form>
    </main>

    <!-- مهم: يجب تحميل المكتبة والإعدادات قبل script.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>

</body>
</html>
```
