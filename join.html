<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101828">
    <title>انضم إلى SPARK | فريق تكنولوجيا المعلومات</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        .join-container {
            width: min(92%, 700px);
            margin: 40px auto;
            color: #182230;
        }

        .join-container h1,
        .join-container > p {
            text-align: center;
        }

        .join-container h1 {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            margin-bottom: 12px;
        }

        .join-container > p {
            line-height: 1.9;
            margin-bottom: 28px;
        }

        .join-container .form-card {
            display: grid;
            gap: 18px;
            padding: clamp(18px, 4vw, 32px);
            background: #fff !important;
            color: #182230 !important;
            border: 1px solid #e1e5eb;
            border-radius: 18px;
            box-shadow: 0 8px 28px rgba(16, 24, 40, .08);
        }

        .join-container .form-card label {
            display: grid;
            gap: 8px;
            color: #182230 !important;
            font-weight: 600;
        }

        .join-container .form-card input,
        .join-container .form-card select,
        .join-container .form-card textarea {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            color: #182230 !important;
            background: #fff !important;
            border: 1px solid #cbd2dc !important;
            border-radius: 9px;
            font-family: inherit;
            font-size: 16px;
            line-height: 1.5;
            box-shadow: none !important;
        }

        .join-container .form-card input:focus,
        .join-container .form-card select:focus,
        .join-container .form-card textarea:focus {
            outline: 2px solid #2563eb;
            outline-offset: 1px;
        }

        .join-container .form-card textarea {
            min-height: 115px;
            resize: vertical;
        }

        .join-container #submitApplication {
            width: 100%;
            min-height: 48px;
            padding: 13px 18px;
            color: #fff !important;
            background: #2563eb !important;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .join-container #submitApplication:disabled {
            opacity: .65;
            cursor: wait;
        }

        #formNotice {
            display: none;
            padding: 13px 15px;
            border-radius: 9px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        #formNotice.visible {
            display: block;
        }

        #formNotice.success {
            color: #166534;
            background: #dcfce7;
            border: 1px solid #86efac;
        }

        #formNotice.error {
            color: #991b1b;
            background: #fee2e2;
            border: 1px solid #fca5a5;
        }

        .join-back {
            display: block;
            width: fit-content;
            margin: 24px auto;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="join-container">
        <h1>⚡ انضم إلى SPARK</h1>

        <p>
            عندك شغف بالتكنولوجيا والألعاب وصناعة المحتوى؟
            عبّي النموذج التالي وقدّم طلب الانضمام لفريقنا.
        </p>

        <form class="form-card" id="joinForm" method="post" novalidate>

            <label for="name">
                الاسم الكامل
                <input type="text" id="name" name="name"
                       autocomplete="name" required>
            </label>

            <label for="studentId">
                الرقم الجامعي
                <input type="text" id="studentId" name="studentId" required>
            </label>

            <label for="email">
                البريد الإلكتروني
                <input type="email" id="email" name="email"
                       autocomplete="email" required>
            </label>

            <label for="major">
                التخصص الجامعي
                <input type="text" id="major" name="major" required>
            </label>

            <label for="year">
                السنة الدراسية
                <select id="year" name="year" required>
                    <option value="">اختر السنة الدراسية</option>
                    <option value="First">السنة الأولى</option>
                    <option value="Second">السنة الثانية</option>
                    <option value="Third">السنة الثالثة</option>
                    <option value="Fourth">السنة الرابعة</option>
                    <option value="Other">أخرى</option>
                </select>
            </label>

            <label for="phone">
                رقم الهاتف
                <input type="tel" id="phone" name="phone"
                       autocomplete="tel" required>
            </label>

            <label for="team">
                الفريق الذي ترغب بالانضمام إليه
                <select id="team" name="team" required>
                    <option value="">اختر الفريق</option>
                    <option value="Games">SPARK Games</option>
                    <option value="Social Media">SPARK Media</option>
                </select>
            </label>

            <label for="skills">
                المهارات والخبرات
                <textarea id="skills" name="skills"
                    placeholder="مثلاً: Unity، برمجة، تصميم، مونتاج..."></textarea>
            </label>

            <label for="reason">
                لماذا تريد الانضمام إلى SPARK؟
                <textarea id="reason" name="reason" required></textarea>
            </label>

            <div id="formNotice" role="status" aria-live="polite"></div>

            <button type="submit" id="submitApplication">
                إرسال طلب الانضمام
            </button>
        </form>

        <a class="join-back" href="index.html">العودة إلى الصفحة الرئيسية</a>
    </main>

    <!-- تحميل المكتبة والإعدادات قبل كود الموقع -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="script.js"></script>

</body>
</html>
```
