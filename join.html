```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101828">

    <title>انضم إلى SPARK | فريق تكنولوجيا المعلومات</title>

<link rel="stylesheet" href="styles.css">
    <style>
        /* تنسيق مستقل لنموذج الانضمام */
        .join-container {
            width: min(92%, 700px);
            margin: 40px auto;
            color: #182230;
        }

        .join-container h1,
        .join-container > p {
            text-align: center;
        }

        .join-container h1 {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            margin-bottom: 12px;
        }

        .join-container > p {
            line-height: 1.9;
            margin-bottom: 28px;
        }

        .form-card {
            display: grid;
            gap: 18px;
            padding: clamp(18px, 4vw, 32px);
            background: #ffffff;
            color: #182230;
            border: 1px solid #e1e5eb;
            border-radius: 18px;
            box-shadow: 0 8px 28px rgba(16, 24, 40, 0.08);
        }

        .form-card label {
            display: grid;
            gap: 8px;
            color: #182230;
            font-weight: 600;
        }

        .form-card input,
        .form-card select,
        .form-card textarea {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            color: #182230 !important;
            background: #ffffff !important;
            border: 1px solid #cbd2dc !important;
            border-radius: 9px;
            font-family: inherit;
            font-size: 16px;
            line-height: 1.5;
            outline: none;
            box-shadow: none !important;
        }

        .form-card input::placeholder,
        .form-card textarea::placeholder {
            color: #7b8492 !important;
            opacity: 1;
        }

        .form-card input:focus,
        .form-card select:focus,
        .form-card textarea:focus {
            border-color: #2563eb !important;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12) !important;
        }

        .form-card textarea {
            min-height: 115px;
            resize: vertical;
        }

        .form-card button[type="submit"] {
            width: 100%;
            min-height: 48px;
            padding: 13px 18px;
            color: #ffffff !important;
            background: #2563eb !important;
            border: none;
            border-radius: 10px;
            font-family: inherit;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .form-card button[type="submit"]:hover {
            opacity: 0.9;
        }

        .form-card button[type="submit"]:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        #formNotice {
            display: none;
            padding: 13px 15px;
            border-radius: 9px;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        #formNotice.visible {
            display: block;
        }

        #formNotice.success {
            color: #166534;
            background: #dcfce7;
            border: 1px solid #86efac;
        }

        #formNotice.error {
            color: #991b1b;
            background: #fee2e2;
            border: 1px solid #fca5a5;
        }

        .join-back {
            display: block;
            width: fit-content;
            margin: 24px auto;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="join-container">
        <h1>انضم إلى SPARK ⚡</h1>

        <p>
            عندك شغف بالتكنولوجيا والألعاب وصناعة المحتوى؟
            عبّي النموذج التالي وقدّم طلب الانضمام لفريقنا.
        </p>

<form class="form-card" id="joinForm" action="#" method="post">
            <label for="name">
                الاسم الكامل
                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="name"
                    required
                >
            </label>

            <label for="studentId">
                الرقم الجامعي
                <input
                    type="text"
                    id="studentId"
                    name="studentId"
                    required
                >
            </label>

            <label for="email">
                البريد الإلكتروني
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                >
            </label>

            <label for="major">
                التخصص الجامعي
                <input
                    type="text"
                    id="major"
                    name="major"
                    required
                >
            </label>

            <label for="year">
                السنة الدراسية
                <select id="year" name="year" required>
                    <option value="">اختر السنة الدراسية</option>
                    <option value="First">السنة الأولى</option>
                    <option value="Second">السنة الثانية</option>
                    <option value="Third">السنة الثالثة</option>
                    <option value="Fourth">السنة الرابعة</option>
                    <option value="Other">أخرى</option>
                </select>
            </label>

            <label for="phone">
                رقم الهاتف
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    autocomplete="tel"
                    required
                >
            </label>

            <label for="team">
                الفريق الذي ترغب بالانضمام إليه
                <select id="team" name="team" required>
                    <option value="">اختر الفريق</option>
                    <option value="Games">SPARK Games</option>
                    <option value="Social Media">SPARK Media</option>
                </select>
            </label>

            <label for="skills">
                المهارات والخبرات
                <textarea
                    id="skills"
                    name="skills"
                    placeholder="مثلاً: Unity، برمجة، تصميم، مونتاج..."
                ></textarea>
            </label>

            <label for="reason">
                لماذا تريد الانضمام إلى SPARK؟
                <textarea
                    id="reason"
                    name="reason"
                    required
                ></textarea>
            </label>

            <div id="formNotice" role="status" aria-live="polite"></div>

            <button type="submit" id="submitApplication">
                إرسال طلب الانضمام
            </button>

        </form>

        <a class="join-back" href="index.html">العودة إلى الصفحة الرئيسية</a>
    </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="script.js"></script>
</body>
</html>
